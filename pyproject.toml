[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fruit-counter"
version = "0.1.0"
description = "Count apples and oranges crossing a line in prerecorded conveyor videos"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10",
    "scipy>=1.11",
    "tensorboard>=2.14",
    "torch>=2.4",
    "torchvision>=0.19",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[project.scripts]
fruit-counter = "fruit_counter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
